[project]
name = "molecular_qm_util"
dynamic = ["version"]
description = "Molecular QM Utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pubchempy",
    "cirpy",
    "beautifulsoup4",
    "openbabel-wheel",
    "molecular_qm_models",
    "rdkit",
    "numpy",
    "simstack",
    "pytest-asyncio>=1.4.0",
    "odmantic>=1.1.0",
]


[project.entry-points."simstack.modules"]
molecular_qm_util = "molecular_qm_util"

[tool.uv.sources]
molecular_qm_models = { git = "https://github.com/simstack/molecular_qm_models.git" }
simstack = { git = "https://github.com/simstack/simstack.git"}

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Package only the inner module directory so the checkout-root shim __init__.py
# is not included in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["molecular_qm_util"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
