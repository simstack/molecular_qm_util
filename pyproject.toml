[project]
name = "molecular_qm_util"
dynamic = ["version"]
description = "Molecular QM Utilities"
requires-python = ">=3.12"
dependencies = [
    "pubchempy",
    "cirpy",
    "beautifulsoup4",
    "openbabel-wheel",
    "molecular_qm_models",
]

[tool.uv.sources]
molecular_qm_models = { git = "https://github.com/simstack/molecular_qm_models.git" }

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
