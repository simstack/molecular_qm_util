[project]
name = "molecular_qm_util"
dynamic = ["version"]
description = "Molecular QM Utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pubchempy",
    "cirpy",
    "beautifulsoup4",
    "openbabel-wheel",
    "molecular_qm_models",
    "rdkit",
    "numpy",
    "simstack",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
molecular_qm_models = { git = "https://github.com/simstack/molecular_qm_models.git" }
simstack = { git = "https://github.com/simstack/simstack.git", rev ="fix-node-submission-logic"}
[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
